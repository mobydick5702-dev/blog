version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      # [CUSTOM] 原为 daily，个人博客没必要每天开 PR；改周更（AUDIT P2-11）
      interval: "weekly"
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
    pull-request-branch-name:
      separator: "-"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    pull-request-branch-name:
      separator: "-"
