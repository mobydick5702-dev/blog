name: Build and Check

# [CUSTOM] 相对上游的改动（AUDIT P2-10）：
#   1. 触发条件新增 paths 过滤 —— 只有源码/内容/依赖/构建配置变化才跑，改文档或图片素材不再白跑 CI
#   2. 去掉 Node 22/23 双矩阵，固定 Node 22 与 package.json 的 engines 对齐，每次 push 由 4 个 job 降为 2 个
on:
  push:
    branches: [ master ]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "svelte.config.js"
      - "postcss.config.mjs"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: Astro Check
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false # Disable auto-install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Astro Check
        run: pnpm astro check

  build:
    runs-on: ubuntu-latest
    name: Astro Build
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false # Disable auto-install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Astro Build
        run: pnpm astro build
